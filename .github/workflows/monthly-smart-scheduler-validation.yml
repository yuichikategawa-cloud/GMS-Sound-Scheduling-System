name: Monthly Smart Scheduler validation

on:
  push:
    branches:
      - feat/monthly-smart-scheduler-engine
      - feat/ai-usage-dashboard
      - feat/free-cloudflare-ai-scheduler
      - feature/ai-usage-and-explanation-clarity
      - feature/ai-usage-report-diagnostics
    paths:
      - "src/features/schedule/services/monthly*.ts"
      - "src/features/schedule/services/aiSchedulingAssistant.ts"
      - "cloudflare/gms-ai-assistant/**"
      - "src/features/schedule/services/historicalRosterProfiles.ts"
      - "src/features/schedule/components/MonthlySmartScheduler.*"
      - "src/features/schedule/components/ScheduleWorkspace.tsx"
      - "src/App.tsx"
      - "src/features/servants/**"
      - "src/features/auth/components/MemberProfilePanel.tsx"
      - "src/features/audit/components/AuditPanel.tsx"
      - "src/features/requests/components/RequestsPanel.tsx"
      - "src/features/requests/components/ServantInbox.tsx"
      - "src/features/schedule/components/ScheduleWorkspace.tsx"
      - "src/features/schedule/hooks/useScheduleActions.ts"
      - "src/features/schedule/services/schedulePersistence.ts"
      - "src/features/availability/services/availabilityData.ts"
      - "src/features/availability/services/availabilityPersistence.ts"
      - "src/features/availability/services/recurringAvailability.ts"
      - "src/features/availability/components/AvailabilityWorkspace.*"
      - "src/features/availability/hooks/useAvailabilityActions.ts"
      - "tests/availability/availabilityPersistence_test.ts"
      - "tests/availability/recurringAvailability_test.ts"
      - "supabase/migrations/20261112092936_gms_custom_weekly_availability_rules.sql"
      - "src/shared/formatters.ts"
      - "src/app/services/dashboardData.ts"
      - "src/app/state/dashboardState.ts"
      - "src/App.tsx"
      - "tests/schedule/monthly*_test.ts"
      - "tests/schedule/aiSchedulingAssistant_test.ts"
      - "tests/cloudflare/aiUsageReport_test.ts"
      - "tests/schedule/historicalRosterProfiles_test.ts"
      - "tests/schedule/schedulePersistence_test.ts"
      - "tests/servants/servantManagement_test.ts"
      - "tests/availability/availabilityData_test.ts"
      - "tests/shared/formatters_test.ts"
      - "supabase/migrations/20261111113446_gms_monthly_schedule_plan_apply.sql"
      - "supabase/migrations/20261111163911_gms_special_service_and_servant_role_qualifications.sql"
      - "supabase/migrations/20261112104554_gms_church_specific_servant_role_qualifications.sql"
# Church-specific qualifications migration filename is kept in sync with the applied staging version.
      - "supabase/tests/monthly_schedule_plan_apply.sql"
      - "tests/app/dashboardData_test.ts"
      - "tests/app/dashboardState_test.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/monthly-smart-scheduler-validation.yml"
      - ".github/workflows/phase-1-push-security-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test shared date and timestamp formatters
        run: deno test --no-lock tests/shared/formatters_test.ts
      - name: Test free AI scheduling context and worker guard
        run: deno test --no-lock tests/schedule/aiSchedulingAssistant_test.ts cloudflare/gms-ai-assistant/tests/worker_test.ts tests/cloudflare/aiUsageReport_test.ts
      - name: Type-check free Cloudflare Worker source
        run: deno check cloudflare/gms-ai-assistant/src/index.ts
      - name: Test monthly slot generation
        run: deno test --no-lock tests/schedule/monthlyScheduleGeneration_test.ts
      - name: Test weekly church serving team patterns
        run: deno test --no-lock tests/schedule/monthlyServingTeams_test.ts
      - name: Test monthly assignment optimizer
        run: deno test --no-lock tests/schedule/monthlyAssignmentOptimizer_test.ts
      - name: Test servant management and role qualification persistence
        run: deno test --no-lock tests/servants/servantManagement_test.ts
      - name: Run read-only December pilot against the inspected Staging snapshot
        run: deno test --no-lock tests/schedule/monthlyScheduleStagingPilot_test.ts
      - name: Test historical servant roster mapping
        run: deno test --no-lock tests/schedule/historicalRosterProfiles_test.ts
      - name: Test schedule persistence RPC adapters
        run: deno test --no-lock tests/schedule/schedulePersistence_test.ts
      - name: Test availability data readiness
        run: deno test --no-lock tests/availability/availabilityData_test.ts
      - name: Test recurring availability patterns and persistence
        run: deno test --no-lock tests/availability/recurringAvailability_test.ts tests/availability/availabilityPersistence_test.ts
      - name: Test dashboard scheduler readiness propagation
        run: deno test --no-lock tests/app/dashboardData_test.ts tests/app/dashboardState_test.ts

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  staging-worker-deploy:
    name: Deploy isolated staging AI Worker
    runs-on: ubuntu-latest
    needs: [deno-tests, frontend-build]
    if: github.ref == 'refs/heads/feature/ai-usage-report-diagnostics'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_GMS_APP_ORIGIN: ${{ vars.STAGING_GMS_APP_ORIGIN }}
      CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
    steps:
      - name: Check staging-only deployment prerequisites
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_SUPABASE_URL STAGING_SUPABASE_ANON_KEY STAGING_GMS_APP_ORIGIN; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if [[ "$CLOUDFLARE_WORKERS_FREE_CONFIRMED" != "true" ]]; then
            missing+=("repository variable CLOUDFLARE_WORKERS_FREE_CONFIRMED=true (confirm Workers Free plan)")
          fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Staging AI Worker deployment skipped"
              echo "The deployment workflow is ready, but these staging-only prerequisites are not configured:"
              for item in "${missing[@]}"; do echo "- $item"; done
              echo "No Cloudflare deployment was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$STAGING_SUPABASE_URL" != "https://uurgomjrsvzfmcpsnitu.supabase.co" ]]; then
            echo "::error::STAGING_SUPABASE_URL does not match the approved GMS staging Supabase project."
            exit 1
          fi
          case "$STAGING_SUPABASE_ANON_KEY" in
            sb_publishable_*) ;;
            *) echo "::error::STAGING_SUPABASE_ANON_KEY must be the staging project's publishable key."; exit 1 ;;
          esac
          case "$STAGING_GMS_APP_ORIGIN" in
            https://gms-sound-scheduling-system-*.vercel.app) ;;
            *) echo "::error::STAGING_GMS_APP_ORIGIN must be the exact GMS Vercel Preview origin."; exit 1 ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Staging-only prerequisites validated; model inference remains disabled."

      - name: Check out source
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install staging Worker secrets and deploy
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          config="cloudflare/gms-ai-assistant/wrangler.staging.toml"
          printf '%s' "$STAGING_SUPABASE_URL" | npx --yes wrangler@4 secret put SUPABASE_URL --config "$config"
          printf '%s' "$STAGING_SUPABASE_ANON_KEY" | npx --yes wrangler@4 secret put SUPABASE_ANON_KEY --config "$config"
          printf '%s' "$STAGING_GMS_APP_ORIGIN" | npx --yes wrangler@4 secret put GMS_APP_ORIGIN --config "$config"
          npx --yes wrangler@4 deploy --config "$config"
          {
            echo "### Isolated staging AI Worker deployed"
            echo "- Worker name: `gms-ai-assistant-staging`"
            echo "- Config: `wrangler.staging.toml`"
            echo "- Supabase: GMS staging project only"
            echo "- Model inference: disabled (`GMS_AI_ENABLED=false`)"
            echo "- Production Worker and Production Supabase were not targeted."
          } >> "$GITHUB_STEP_SUMMARY"

