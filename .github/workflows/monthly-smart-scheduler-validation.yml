name: Monthly Smart Scheduler validation

on:
  push:
    branches:
      - feat/monthly-smart-scheduler-engine
      - feat/free-cloudflare-ai-scheduler
    paths:
      - "src/features/schedule/services/monthly*.ts"
      - "src/features/schedule/services/aiSchedulingAssistant.ts"
      - "cloudflare/gms-ai-assistant/**"
      - "src/features/schedule/services/historicalRosterProfiles.ts"
      - "src/features/schedule/components/MonthlySmartScheduler.*"
      - "src/features/schedule/components/ScheduleWorkspace.tsx"
      - "src/App.tsx"
      - "src/features/servants/**"
      - "src/features/auth/components/MemberProfilePanel.tsx"
      - "src/features/audit/components/AuditPanel.tsx"
      - "src/features/requests/components/RequestsPanel.tsx"
      - "src/features/requests/components/ServantInbox.tsx"
      - "src/features/schedule/components/ScheduleWorkspace.tsx"
      - "src/features/schedule/hooks/useScheduleActions.ts"
      - "src/features/schedule/services/schedulePersistence.ts"
      - "src/features/availability/services/availabilityData.ts"
      - "src/features/availability/services/availabilityPersistence.ts"
      - "src/features/availability/services/recurringAvailability.ts"
      - "src/features/availability/components/AvailabilityWorkspace.*"
      - "src/features/availability/hooks/useAvailabilityActions.ts"
      - "tests/availability/availabilityPersistence_test.ts"
      - "tests/availability/recurringAvailability_test.ts"
      - "supabase/migrations/20261112092936_gms_custom_weekly_availability_rules.sql"
      - "src/shared/formatters.ts"
      - "src/app/services/dashboardData.ts"
      - "src/app/state/dashboardState.ts"
      - "src/App.tsx"
      - "tests/schedule/monthly*_test.ts"
      - "tests/schedule/aiSchedulingAssistant_test.ts"
      - "tests/schedule/historicalRosterProfiles_test.ts"
      - "tests/schedule/schedulePersistence_test.ts"
      - "tests/servants/servantManagement_test.ts"
      - "tests/availability/availabilityData_test.ts"
      - "tests/shared/formatters_test.ts"
      - "supabase/migrations/20261111113446_gms_monthly_schedule_plan_apply.sql"
      - "supabase/migrations/20261111163911_gms_special_service_and_servant_role_qualifications.sql"
      - "supabase/tests/monthly_schedule_plan_apply.sql"
      - "tests/app/dashboardData_test.ts"
      - "tests/app/dashboardState_test.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/monthly-smart-scheduler-validation.yml"
      - ".github/workflows/phase-1-push-security-validation.yml"

permissions:
  contents: read

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test shared date and timestamp formatters
        run: deno test --no-lock tests/shared/formatters_test.ts
      - name: Test free AI scheduling context and worker guard
        run: deno test --no-lock tests/schedule/aiSchedulingAssistant_test.ts cloudflare/gms-ai-assistant/tests/worker_test.ts
      - name: Type-check free Cloudflare Worker source
        run: deno check cloudflare/gms-ai-assistant/src/index.ts
      - name: Test monthly slot generation
        run: deno test --no-lock tests/schedule/monthlyScheduleGeneration_test.ts
      - name: Test weekly church serving team patterns
        run: deno test --no-lock tests/schedule/monthlyServingTeams_test.ts
      - name: Test monthly assignment optimizer
        run: deno test --no-lock tests/schedule/monthlyAssignmentOptimizer_test.ts
      - name: Test servant management and role qualification persistence
        run: deno test --no-lock tests/servants/servantManagement_test.ts
      - name: Run read-only December pilot against the inspected Staging snapshot
        run: deno test --no-lock tests/schedule/monthlyScheduleStagingPilot_test.ts
      - name: Test historical servant roster mapping
        run: deno test --no-lock tests/schedule/historicalRosterProfiles_test.ts
      - name: Test schedule persistence RPC adapters
        run: deno test --no-lock tests/schedule/schedulePersistence_test.ts
      - name: Test availability data readiness
        run: deno test --no-lock tests/availability/availabilityData_test.ts
      - name: Test recurring availability patterns and persistence
        run: deno test --no-lock tests/availability/recurringAvailability_test.ts tests/availability/availabilityPersistence_test.ts
      - name: Test dashboard scheduler readiness propagation
        run: deno test --no-lock tests/app/dashboardData_test.ts tests/app/dashboardState_test.ts

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
