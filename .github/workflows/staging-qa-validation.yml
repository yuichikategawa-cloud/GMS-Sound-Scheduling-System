name: Staging QA validation
on:
  push:
    branches:
      - "qa/**"
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/staging-qa-validation.yml"
  pull_request:
    branches:
      - security/push-endpoint-hardening
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/staging-qa-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-lock tests/shared/formatters_test.ts
      - run: deno test --no-lock tests/app/assignmentConfirmation_test.ts
      - run: deno test --no-lock tests/schedule/dailyDisplay_test.ts
      - run: deno test --no-lock tests/schedule/assignmentValidation_test.ts
      - run: deno test --no-lock tests/requests/swapValidation_test.ts
      - run: deno test --no-lock --allow-read=src,tests tests/styles/styleOwnership_test.ts
