<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171d35">
  <title>GMS Sound — You're offline</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f5fa;color:#202b40;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,420px);padding:30px;border:1px solid #e0e5ef;border-radius:20px;background:#fff;box-shadow:0 12px 36px #17243a12;text-align:center}.mark{width:62px;height:62px;margin:0 auto 18px;display:grid;place-items:center;border-radius:17px;background:#171d35}.mark img{width:42px;height:42px}h1{font-size:21px;margin:0 0 10px}p{font-size:14px;line-height:1.6;color:#66718a;margin:0 0 22px}button{border:0;border-radius:10px;background:#5145e8;color:white;font-weight:750;padding:12px 20px;font-size:14px}small{display:block;margin-top:20px;color:#8992a5;font-size:10px;letter-spacing:.12em;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark"><img src="/gms-sound-favicon.svg" alt="GMS sound logo"></div>
    <h1>You're offline</h1>
    <p>GMS Sound Scheduling needs an internet connection to load private schedules and availability. Reconnect, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>SERVE WITH EXCELLENCE</small>
  </main>
</body>
</html>
