name = "gms-ai-assistant"
main = "src/index.ts"
compatibility_date = "2026-11-11"
workers_dev = true

# Workers AI native binding only. No AI Gateway or third-party provider route.
[ai]
binding = "AI"

# SQLite-backed Durable Object for serialized usage accounting, caching and refresh cooldowns.
# Cloudflare account analytics remain the source for daily Neuron/request safety checks.
[[durable_objects.bindings]]
name = "AI_GUARD"
class_name = "AiBudgetGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AiBudgetGuard"]

# Production AI is approved for the confirmed Cloudflare Workers Free account.
# The Worker still fails closed if analytics credentials or usage data are unavailable.
[secrets]
required = [
  "SUPABASE_URL",
  "SUPABASE_ANON_KEY",
  "GMS_APP_ORIGIN",
  "CLOUDFLARE_ACCOUNT_ID",
  "CLOUDFLARE_API_TOKEN",
]

[vars]
GMS_AI_ENABLED = "true"
